openapi: 3.0.3

info:
  title: API de Sugestões dos Alunos
  version: 2.0.0
  description: API de sugestões dos alunos que exige autenticação

servers:
  - url: https://api.estgv.exemplo/v2

security:
  - tokenJWT: []

paths:
  /sugestoes:
    get:
      operationId: listarSugestoes
      summary: Listar sugestões, com filtros e paginação
      description: Qualquer utilizador autenticado pode consultar sugestões; um aluno apenas acede às suas e os serviços acedem a todas.
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Estado'
        - name: categoria
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CodigoCategoria'
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: tamanhoPagina
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Lista de sugestões correspondente aos filtros.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivada'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSugestoes'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        default:
          $ref: '#/components/responses/ErroGenerico'

    post:
      operationId: criarSugestao
      summary: Submeter uma sugestão
      description: Apenas alunos podem submeter sugestões. O número de aluno é obtido do token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '201':
          description: Sugestão criada com sucesso.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /sugestoes/{id}:
    get:
      operationId: obterSugestao
      summary: Obter uma sugestão
      description: Qualquer utilizador autenticado pode consultar uma sugestão; um aluno apenas acede às suas e os serviços acedem a todas.
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sugestão encontrada.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivada'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
              example:
                id: 42
                titulo: Melhorar os espaços de estudo
                descricao: Criar mais espaços de estudo com mesas e tomadas disponíveis.
                categoria: instalacoes
                numeroAluno: '12345'
                estado: aceite
                dataCriacao: '2026-10-01T10:00:00Z'
                dataAtualizacao: '2026-10-05T14:30:00Z'
                dataResolucao: null
        '304':
          description: A versão em cache continua válida.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivada'
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        default:
          $ref: '#/components/responses/ErroGenerico'

    put:
      operationId: substituirSugestao
      summary: Editar uma sugestão ainda submetida
      description: Apenas o aluno autor da sugestão pode editá-la enquanto estiver submetida.
      parameters:
        - $ref: '#/components/parameters/id'
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SugestaoNova'
      responses:
        '200':
          description: Sugestão atualizada com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugestao'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          $ref: '#/components/responses/ConflictEdicao'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/ErroGenerico'

    delete:
      operationId: retirarSugestao
      summary: Retirar uma sugestão ainda submetida
      description: Apenas o aluno autor da sugestão pode retirá-la enquanto estiver submetida.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Sugestão retirada com sucesso, sem conteúdo na resposta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          $ref: '#/components/responses/ConflictRetirada'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /sugestoes/{id}/acompanhamentos:
    get:
      operationId: listarAcompanhamentos
      summary: Consultar o histórico de acompanhamentos
      description: Devolve os acompanhamentos do mais antigo para o mais recente. Qualquer utilizador autenticado pode consultar; um aluno apenas acede aos acompanhamentos das suas sugestões e os serviços acedem a todos.
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Histórico de acompanhamentos.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CachePrivada'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Acompanhamento'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        default:
          $ref: '#/components/responses/ErroGenerico'

    post:
      operationId: registarAcompanhamento
      summary: Registar uma mudança de estado
      description: Apenas os serviços podem registar acompanhamentos. O responsável é obtido do token.
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcompanhamentoNovo'
      responses:
        '201':
          description: Acompanhamento registado com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Acompanhamento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/Proibido'
        '409':
          $ref: '#/components/responses/ConflictAcompanhamento'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /estatisticas/resolucao:
    get:
      operationId: obterEstatisticasResolucao
      summary: Consultar estatísticas de resolução por estado
      security: []
      parameters:
        - name: anoLetivo
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{4}$'
      responses:
        '200':
          description: Estatísticas de resolução do ano letivo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheEstatisticas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasResolucao'
              example:
                anoLetivo: '2026-2027'
                totalSugestoes: 12
                porEstado:
                  submetida: 3
                  em_analise: 2
                  aceite: 3
                  rejeitada: 1
                  resolvida: 3
                taxaResolucao: 0.25
                tempoMedioResolucaoDias: 14.5
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /estatisticas/categorias:
    get:
      operationId: obterEstatisticasCategorias
      summary: Consultar estatísticas por categoria
      security: []
      parameters:
        - name: anoLetivo
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}-[0-9]{4}$'
      responses:
        '200':
          description: Estatísticas de resolução agrupadas por categoria.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheEstatisticas'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasCategorias'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /categorias:
    get:
      operationId: listarCategorias
      summary: Listar as categorias e a sua descrição
      security: []
      responses:
        '200':
          description: Lista de categorias disponíveis.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheCategorias'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
        default:
          $ref: '#/components/responses/ErroGenerico'

  /tokens:
    post:
      operationId: criarToken
      summary: Autenticar um utilizador e emitir um token
      description: Emite um token Bearer válido durante 900 segundos após validar as credenciais.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciais'
      responses:
        '200':
          description: Token emitido com sucesso.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NSIsIm5vbWUiOiJBbmEgU2lsdmEiLCJwYXBlbCI6ImFsdW5vIiwiaWF0IjoxNzYwMDAwMDAwLCJleHAiOjE3NjAwMDA5MDB9.dG9rZW5fZGVfZXhlbXBsb19zZW1fc2VncmVkbw
                tipo: Bearer
                expiraEm: 900
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/CredenciaisInvalidas'
        default:
          $ref: '#/components/responses/ErroGenerico'

components:
  securitySchemes:
    tokenJWT:
      description: |
        | Claim | Tipo | Significado |
        | --- | --- | --- |
        | `sub` | string | Identificador do utilizador |
        | `nome` | string | Nome completo do utilizador |
        | `papel` | string | Papel do utilizador: `aluno` ou `servicos` |
        | `iat` | integer | Instante de emissão do token (Unix timestamp em segundos) |
        | `exp` | integer | Instante de expiração do token (Unix timestamp em segundos) |
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Estado:
      type: string
      enum:
        - submetida
        - em_analise
        - aceite
        - rejeitada
        - resolvida

    CodigoCategoria:
      type: string
      enum:
        - instalacoes
        - ensino
        - servicos
        - atividades
        - outra

    Categoria:
      type: object
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoCategoria'
        descricao:
          type: string
          minLength: 3
          maxLength: 80
      required:
        - codigo
        - descricao

    SugestaoNova:
      type: object
      properties:
        titulo:
          type: string
          minLength: 10
          maxLength: 120
        descricao:
          type: string
          minLength: 20
          maxLength: 2000
        categoria:
          $ref: '#/components/schemas/CodigoCategoria'
      required:
        - titulo
        - descricao
        - categoria

    Sugestao:
      allOf:
        - $ref: '#/components/schemas/SugestaoNova'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            numeroAluno:
              type: string
              pattern: '^[0-9]{5,8}$'
              readOnly: true
            estado:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            dataCriacao:
              type: string
              format: date-time
              readOnly: true
            dataAtualizacao:
              type: string
              format: date-time
              readOnly: true
            dataResolucao:
              type: string
              format: date-time
              nullable: true
              readOnly: true
          required:
            - id
            - numeroAluno
            - estado
            - dataCriacao
            - dataAtualizacao
            - dataResolucao

    AcompanhamentoNovo:
      type: object
      properties:
        novoEstado:
          $ref: '#/components/schemas/Estado'
        nota:
          type: string
          minLength: 5
          maxLength: 500
      required:
        - novoEstado
        - nota

    Acompanhamento:
      allOf:
        - $ref: '#/components/schemas/AcompanhamentoNovo'
        - type: object
          properties:
            id:
              type: integer
              minimum: 1
              readOnly: true
            estadoAnterior:
              allOf:
                - $ref: '#/components/schemas/Estado'
              readOnly: true
            data:
              type: string
              format: date-time
              readOnly: true
            responsavel:
              type: string
              pattern: '^[A-Z][a-z]+ [A-Z][a-z]+$'
              minLength: 5
              maxLength: 60
              readOnly: true
          required:
            - id
            - estadoAnterior
            - data
            - responsavel

    Credenciais:
      type: object
      properties:
        utilizador:
          type: string
          pattern: '^([0-9]{5,8}|[a-z]+\.[a-z]+)$'
        palavraPasse:
          type: string
          minLength: 8
          maxLength: 128
          format: password
      required:
        - utilizador
        - palavraPasse

    Token:
      type: object
      properties:
        token:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
        tipo:
          type: string
          enum:
            - Bearer
        expiraEm:
          type: integer
          minimum: 1
      required:
        - token
        - tipo
        - expiraEm

    ListaSugestoes:
      type: object
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanhoPagina:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        itens:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Sugestao'
      required:
        - pagina
        - tamanhoPagina
        - total
        - itens

    EstatisticasResolucao:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        totalSugestoes:
          type: integer
          minimum: 0
        porEstado:
          type: object
          properties:
            submetida:
              type: integer
              minimum: 0
            em_analise:
              type: integer
              minimum: 0
            aceite:
              type: integer
              minimum: 0
            rejeitada:
              type: integer
              minimum: 0
            resolvida:
              type: integer
              minimum: 0
          required:
            - submetida
            - em_analise
            - aceite
            - rejeitada
            - resolvida
        taxaResolucao:
          type: number
          minimum: 0
          maximum: 1
        tempoMedioResolucaoDias:
          type: number
          minimum: 0
          nullable: true
      required:
        - anoLetivo
        - totalSugestoes
        - porEstado
        - taxaResolucao
        - tempoMedioResolucaoDias

    EstatisticasCategorias:
      type: object
      properties:
        anoLetivo:
          type: string
          pattern: '^[0-9]{4}-[0-9]{4}$'
        categorias:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            properties:
              categoria:
                $ref: '#/components/schemas/CodigoCategoria'
              total:
                type: integer
                minimum: 0
              resolvidas:
                type: integer
                minimum: 0
              taxaResolucao:
                type: number
                minimum: 0
                maximum: 1
            required:
              - categoria
              - total
              - resolvidas
              - taxaResolucao
      required:
        - anoLetivo
        - categorias

    Erro:
      type: object
      properties:
        codigo:
          type: integer
          minimum: 400
          maximum: 599
        mensagem:
          type: string
          minLength: 1
          maxLength: 200
        detalhes:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              problema:
                type: string
            required:
              - campo
              - problema
      required:
        - codigo
        - mensagem

  parameters:
    id:
      name: id
      in: path
      required: true
      description: Identificador positivo da sugestão.
      schema:
        type: integer
        minimum: 1

  responses:
    NaoAutenticado:
      description: É necessária autenticação válida.
      headers:
        WWW-Authenticate:
          description: Desafio de autenticação Bearer.
          schema:
            type: string
            enum:
              - Bearer
              - 'Bearer error="invalid_token"'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            codigo: 401
            mensagem: Token ausente, inválido ou expirado.

    CredenciaisInvalidas:
      description: As credenciais são inválidas.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    Proibido:
      description: O utilizador autenticado não tem autorização para esta operação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    BadRequest:
      description: Pedido mal formado ou dados que não cumprem o schema.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    NotFound:
      description: O recurso pedido não existe. Para um aluno, uma sugestão de que não é autor também é considerada inexistente.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ConflictEdicao:
      description: A sugestão já não está no estado submetida e não pode ser editada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ConflictRetirada:
      description: A sugestão já não está no estado submetida e não pode ser retirada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ConflictAcompanhamento:
      description: A transição de estado não é permitida ou a sugestão está fechada.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    PreconditionFailed:
      description: O valor de If-Match não corresponde à versão atual da sugestão.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

    ErroGenerico:
      description: Ocorreu um erro não especificado nas respostas da operação.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

  headers:
    CacheCategorias:
      description: Cache pública durante 24 horas.
      schema:
        type: string
        enum: ['public, max-age=86400']

    CacheEstatisticas:
      description: Cache pública durante uma hora.
      schema:
        type: string
        enum: ['public, max-age=3600']

    CachePrivada:
      description: Cache privada com revalidação obrigatória.
      schema:
        type: string
        enum: ['private, no-cache']

    NoStore:
      description: A resposta não deve ser armazenada em cache.
      schema:
        type: string
        enum: ['no-store']

    ETag:
      description: Identificador da versão do recurso.
      schema:
        type: string

    Location:
      description: URL do recurso criado.
      schema:
        type: string
